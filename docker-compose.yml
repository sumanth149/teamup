services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=teamup-super-secret-key-prod-grade-2026-xyz!
      - DEBUG=True
    volumes:
      - ./backend:/app
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
